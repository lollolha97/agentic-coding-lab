<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>09 Three.js</title><link rel="icon" href="data:,"><link rel="stylesheet" href="base.css"></head><body>
<div class="hud"><div class="n">09 · THREE.JS</div><h1>Three.js 3D 씬</h1><p>조명·그림자·PBR 재질이 있는 회전 토러스 노트와 큐브 링</p></div>
<script type="module">
import * as THREE from './vendor/three.module.js';
const r=new THREE.WebGLRenderer({antialias:true,alpha:true});r.setSize(innerWidth,innerHeight);r.setPixelRatio(Math.min(devicePixelRatio,2));r.shadowMap.enabled=true;document.body.appendChild(r.domElement);
const s=new THREE.Scene();s.fog=new THREE.Fog(0x17110d,8,22);const cam=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.1,100);cam.position.set(0,2.2,8);cam.lookAt(0,.6,0);
s.add(new THREE.HemisphereLight(0xffd9b8,0x22140c,.8));const L=new THREE.DirectionalLight(0xffffff,2.4);L.position.set(4,7,3);L.castShadow=true;L.shadow.mapSize.set(1024,1024);s.add(L);
const pl=new THREE.PointLight(0xff5a2a,30,12);pl.position.set(-2,1.5,2);s.add(pl);
const knot=new THREE.Mesh(new THREE.TorusKnotGeometry(1,.34,220,32),new THREE.MeshStandardMaterial({color:0xff7a3d,metalness:.55,roughness:.25}));knot.position.y=1.2;knot.castShadow=true;s.add(knot);
const floor=new THREE.Mesh(new THREE.CircleGeometry(7,64),new THREE.MeshStandardMaterial({color:0x2a1a12,roughness:.9}));floor.rotation.x=-Math.PI/2;floor.position.y=-.6;floor.receiveShadow=true;s.add(floor);
const ring=new THREE.Group();s.add(ring);for(let i=0;i<14;i++){const m=new THREE.Mesh(new THREE.BoxGeometry(.32,.32,.32),new THREE.MeshStandardMaterial({color:i%2?0xe8455f:0xffc15e,roughness:.4}));const a=i/14*Math.PI*2;m.position.set(Math.cos(a)*3,0,Math.sin(a)*3);m.castShadow=true;ring.add(m)}
addEventListener('resize',()=>{r.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()});
const clk=new THREE.Clock();r.setAnimationLoop(()=>{const t=clk.getElapsedTime();knot.rotation.set(t*.4,t*.6,0);ring.rotation.y=-t*.5;ring.children.forEach((m,i)=>{m.position.y=Math.sin(t*2+i)*.4;m.rotation.x=t+i});r.render(s,cam)});
</script></body></html>

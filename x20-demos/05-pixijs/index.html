<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>05 PixiJS</title><link rel="icon" href="data:,"><link rel="stylesheet" href="base.css"></head><body>
<div class="hud"><div class="n">05 · PIXIJS</div><h1>PixiJS GPU 2D</h1><p>WebGL로 파티클 3,000개를 매 프레임 회전·가산 블렌딩</p></div>
<script type="module">
import {Application,Graphics,Container} from './pixi.min.mjs';
const app=new Application(); await app.init({resizeTo:window,backgroundAlpha:0,antialias:true}); document.body.appendChild(app.canvas);
const tex=app.renderer.generateTexture(new Graphics().circle(0,0,6).fill(0xffffff));
const box=new Container(); app.stage.addChild(box); const cols=[0xff7a3d,0xe8455f,0xffc15e]; const ps=[];
const {Sprite}=await import('./pixi.min.mjs');
for(let i=0;i<3000;i++){const s=new Sprite(tex);s.anchor.set(.5);s.tint=cols[i%3];s.blendMode='add';s.alpha=.55;
 s.r=40+Math.random()*320;s.a=Math.random()*Math.PI*2;s.v=(.002+Math.random()*.01)*(i%2?1:-1);s.scale.set(.3+Math.random()*.8);box.addChild(s);ps.push(s)}
let t=0; window.__frames=0;
app.ticker.add(tk=>{t+=tk.deltaTime*.016;window.__frames++;box.x=app.screen.width/2;box.y=app.screen.height/2+40;
 for(const s of ps){s.a+=s.v*tk.deltaTime;const w=s.r*(1+.15*Math.sin(t*2+s.r*.03));s.x=Math.cos(s.a)*w;s.y=Math.sin(s.a)*w*.6}});
</script></body></html>
